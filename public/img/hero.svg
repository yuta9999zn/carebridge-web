<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="介護のイメージイラスト">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e89177"/>
      <stop offset="1" stop-color="#c8694e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f7efe4"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <circle cx="430" cy="150" r="120" fill="url(#sun)" opacity="0.9"/>
  <circle cx="120" cy="90" r="10" fill="#c8694e" opacity="0.5"/>
  <circle cx="540" cy="330" r="14" fill="#1f3a4d" opacity="0.25"/>
  <circle cx="70" cy="360" r="18" fill="#9a8f5a" opacity="0.3"/>

  <!-- ground -->
  <path d="M0 470 Q300 410 600 470 L600 520 L0 520 Z" fill="#e9d9cf"/>

  <!-- heart connecting the two -->
  <path d="M300 120 c-18 -26 -60 -16 -60 16 c0 26 36 44 60 64 c24 -20 60 -38 60 -64 c0 -32 -42 -42 -60 -16 z" fill="#c8694e"/>
  <path d="M300 120 c-18 -26 -60 -16 -60 16 c0 26 36 44 60 64 c24 -20 60 -38 60 -64 c0 -32 -42 -42 -60 -16 z" fill="#fff" opacity="0.15"/>

  <!-- elderly person (left, seated, navy) -->
  <g>
    <rect x="150" y="300" width="120" height="120" rx="24" fill="#1f3a4d"/>
    <circle cx="210" cy="270" r="34" fill="#f0d9c7"/>
    <path d="M178 260 q32 -34 64 0" fill="none" stroke="#cdd6db" stroke-width="10" stroke-linecap="round"/>
    <rect x="196" y="420" width="14" height="70" rx="7" fill="#1f3a4d"/>
    <rect x="214" y="420" width="14" height="70" rx="7" fill="#1f3a4d"/>
  </g>

  <!-- caregiver (right, standing, terracotta) -->
  <g>
    <rect x="338" y="278" width="104" height="150" rx="30" fill="#c8694e"/>
    <circle cx="390" cy="248" r="32" fill="#f0d9c7"/>
    <path d="M362 240 q28 -30 56 0" fill="none" stroke="#3a2f2a" stroke-width="10" stroke-linecap="round"/>
    <!-- supporting arm reaching toward elderly -->
    <path d="M340 330 q-50 6 -78 -18" fill="none" stroke="#c8694e" stroke-width="20" stroke-linecap="round"/>
    <rect x="356" y="428" width="14" height="64" rx="7" fill="#b15a40"/>
    <rect x="410" y="428" width="14" height="64" rx="7" fill="#b15a40"/>
  </g>

  <!-- sparkles -->
  <g fill="#fffdf9">
    <path d="M470 230 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M150 180 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.8"/>
  </g>
</svg>
